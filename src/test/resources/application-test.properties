# Test-only configuration for the V-01 authorisation integration tests.
# Nothing here is read by any deployed environment: it is loaded by @ActiveProfiles("test")
# from the test classpath and the datasource is in-memory.

spring.datasource.url=jdbc:h2:mem:cardirehab-authz;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Keep startup side effects out of the tests.
firebase.enabled=false
app.resources.seed.enabled=false
app.admin.seed.enabled=false
app.account.deletion-sweep-cron=-
app.account.deletion-window-minutes=60

jwt.secret=test-only-secret-not-used-for-any-deployed-environment
app.frontend.url=http://localhost:3000
secure.files.base-path=${java.io.tmpdir}/cardirehab-test-files
app.soha.upload-dir=${java.io.tmpdir}/cardirehab-test-soha
chat.message.delete-window-hours=24

logging.level.com.healthcare.herplatform.security.PatientAccessGuard=WARN
